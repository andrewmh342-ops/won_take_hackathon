spring.application.name=wontake
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.provider=${AI_PROVIDER:auto}
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
app.ai.workspace=${ANTHROPIC_WORKSPACE_ID:}
app.ai.version=${ANTHROPIC_VERSION:2023-06-01}
