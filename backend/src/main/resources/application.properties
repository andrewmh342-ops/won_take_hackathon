spring.application.name=wontake
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.provider=${AI_PROVIDER:auto}
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
app.ai.workspace=${ANTHROPIC_WORKSPACE_ID:}
app.ai.version=${ANTHROPIC_VERSION:2023-06-01}
# 서버를 켠 뒤 Claude 호출 총 상한(크레딧 보호). 호출당 약 2~4센트 기준 500회는 약 $10~20.
app.ai.max-calls=${AI_MAX_CALLS:500}
# 안전 거절 시 서버 측 대체 모델 재시도(beta). 계정에서 400이 나면 off로 끈다.
app.ai.fallbacks=${ANTHROPIC_FALLBACKS:default}
